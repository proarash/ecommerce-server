services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      ENV: ${ENV:-dev}
      PORT: ${PORT:-4000}
      DOMAIN: ${DOMAIN:-localhost}
      DSN: ${DSN:-host=db user=postgres password=postgres dbname=ecommerce port=5432 sslmode=disable TimeZone=Asia/Tehran}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_MOBILE: ${ADMIN_MOBILE:-09120000000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      SITE_NAME: ${SITE_NAME:-Shop}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      ZIBAL_MERCHANT: ${ZIBAL_MERCHANT:-zibal}
      ZIBAL_CALLBACK_URL: ${ZIBAL_CALLBACK_URL:-http://localhost:4000/payment/callback}
      CLIENT_PAYMENT_REDIRECT_URL: ${CLIENT_PAYMENT_REDIRECT_URL:-http://localhost:3000/payment/result}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  db:
    image: postgres:18-alpine3.24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
