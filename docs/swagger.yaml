  /ws/chat:
    get:
      description: Upgrades to WebSocket. Authenticates with the httpOnly x-access-token
        cookie (browsers send it automatically), the X-Access-Token request header
        (app), or the token query parameter (?token=<access_token>); the roles are
        taken from the JWT; users with the support or admin role join as agents, everyone
        else as a customer. Customers send {"message":"..."}; support agents send
        {"room_id":1,"message":"..."}. Server pushes ChatMessage JSON frames.
      parameters:
      - description: Access token, for clients that cannot send the Authorization
          header
        in: query
        name: token
        type: string
      responses:
        "101":
          description: Switching Protocols
          schema:
            $ref: '#/definitions/internal_chat.ChatMessage'
      summary: Real-time support chat WebSocket
      tags:
      - Chat
