  /media/{file}:
    get:
      description: Serves an uploaded image by its exact stored file name (<uuid>.<extension>).
        Any other name returns 404; directory listing is not available.
      parameters:
      - description: Stored file name, e.g. 3f2b8c1e-9a4d-4e2f-8b1a-2c3d4e5f6a7b.jpg
        in: path
        name: file
        required: true
        type: string
      produces:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Serve uploaded image
      tags:
      - Media
  /media/{id}:
    delete:
      description: Permanently deletes the media record and its file from disk, unassigning
        it from every product and category that uses it.
      parameters:
      - description: Media ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.MessageResponse'
              type: object
      summary: Delete media
      tags:
      - Media
    put:
      consumes:
      - multipart/form-data
      description: Replaces the image file of an existing media record (jpeg, png,
        gif, webp; max 2MB). The record keeps its ID and assignments, so every product
        or category using it shows the new image. The file gets a new <uuid>.<extension>
        name and the old file is deleted from disk.
      parameters:
      - description: Media ID
        in: path
        name: id
        required: true
        type: integer
      - description: Image file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_media.Media'
              type: object
      summary: Replace media image
      tags:
      - Media
  /media/upload:
    post:
      consumes:
      - multipart/form-data
      description: 'Uploads images (jpeg, png, gif, webp; max 2MB each) and assigns
        them to the target selected by type: 1 = product (one or more images, appended),
        2 = category (exactly one image, replaces the current one). Files are stored
        as <uuid>.<extension> and served from /media/{file}.'
      parameters:
      - description: Product ID or Category ID, depending on type
        in: query
        name: pid
        required: true
        type: integer
      - description: 'Target type: 1 = product, 2 = category'
        enum:
        - 1
        - 2
        in: query
        name: type
        required: true
        type: integer
      - description: Image files; repeat the field for multiple product images, exactly
          one for a category
        in: formData
        name: files
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_media.Media'
                  type: array
              type: object
      summary: Upload images for a product or category
      tags:
      - Media
  /payment/callback:
    get:
      description: Called by the Zibal gateway. Verifies the payment and credits the
        paid amount to the customer wallet. For orders the order price is then debited
        from the wallet and order/transaction/pre-invoice are updated. Sends bot messages
        and redirects (302) to the client app with ?inv=inv-<ORDER-ID> for orders
        or ?wallet=wlt-<TRACK-ID> for wallet charges
      parameters:
      - description: Zibal track ID
        in: query
        name: trackId
        required: true
        type: integer
      - description: 1 when payment succeeded
        in: query
        name: success
        type: integer
      - description: Zibal status
        in: query
        name: status
        type: integer
      - description: Merchant order ID
        in: query
        name: orderId
        type: string
      responses:
        "302":
          description: Redirect to client payment result page
      summary: Zibal payment callback
      tags:
      - Payment
