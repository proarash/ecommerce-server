host: localhost:4000
info:
  contact: {}
  description: 'E-commerce backend: catalog, cart, orders, Zibal payments, inventory,
    CMS, support chat and notifications. All JSON responses are wrapped in {"message":
    string, "data": any}.'
  title: E-Commerce Server API
  version: "1.0"
paths:
  /admin/notifications:
    get:
      parameters:
      - description: Filter by user ID
        in: query
        name: user_id
        type: integer
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 20
        description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.PaginatedResponse'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/internal_notification.Notification'
                        type: array
                    type: object
              type: object
      summary: List notifications
      tags:
      - Admin Notifications
    post:
      consumes:
      - application/json
      description: Stores the notification and dispatches it via Telegram when channel
        is telegram or both. Omit user_id to broadcast.
      parameters:
      - description: Notification
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_notification.CreateNotificationDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_notification.Notification'
              type: object
      summary: Create and dispatch notification
      tags:
      - Admin Notifications
  /admin/notifications/{id}:
    delete:
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.MessageResponse'
              type: object
      summary: Delete notification
      tags:
      - Admin Notifications
    get:
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_notification.Notification'
              type: object
      summary: Get notification
      tags:
      - Admin Notifications
    patch:
      consumes:
      - application/json
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_notification.UpdateNotificationDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_notification.Notification'
              type: object
      summary: Update notification
      tags:
      - Admin Notifications
  /admin/stats:
    get:
      description: users counts accounts that only have the user role; staff counts
        accounts with any other role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_admin.StatsResponse'
              type: object
      summary: System statistics
      tags:
      - Admin
  /admin/users:
    get:
      description: Lists all users. Filter by a role the user has, or set staff=true
        to list every user with at least one role besides "user".
      parameters:
      - description: Role
        enum:
        - user
        - admin
        - storekeeper
        - accountant
        - marketer
        - support
        in: query
        name: role
        type: string
      - description: Only users with at least one staff role
        in: query
        name: staff
        type: boolean
      - description: Search in mobile or name
        in: query
        name: search
        type: string
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 20
        description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.PaginatedResponse'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_user.User'
                        type: array
                    type: object
              type: object
      summary: List users
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Creates a user with the given roles (any of user, storekeeper,
        accountant, marketer, support; the user role is always included). Creating
        another admin is not allowed. default_avatar_id is a preset frontend avatar
        index (1..5); avatar_media_id references an uploaded media asset.
      parameters:
      - description: User
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_admin.CreateUserDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_user.User'
              type: object
      summary: Create user
      tags:
      - Admin
  /admin/users/{id}:
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_user.User'
              type: object
      summary: Get user
      tags:
      - Admin
  /admin/users/{id}/impersonate:
    post:
      description: Admin only. Returns a 24h access token for the given user as the
        httpOnly x-access-token cookie (replacing the admin session cookie in this
        browser), without mobile/password. No session is stored, so it is not renewed
        and ends when it expires. The token carries impersonator_id with the admin's
        ID.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: x-access-token for the impersonated user (httpOnly)
              type: string
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.TokenResponse'
              type: object
      summary: Login as user
      tags:
      - Admin
  /admin/users/{id}/roles:
    patch:
      consumes:
      - application/json
      description: Replaces the roles of a user with the given list (any of user,
        storekeeper, accountant, marketer, support). The user role is always kept.
        The admin role cannot be granted or removed. The user's current token keeps
        the old roles until it is renewed.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Roles
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_admin.UpdateRolesDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_user.User'
              type: object
      summary: Set user roles
      tags:
      - Admin
  /admin/users/{id}/status:
    patch:
      consumes:
      - application/json
      description: Disabled users cannot log in or refresh their token. Admin accounts
        and your own account cannot be changed.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_admin.UpdateStatusDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_user.User'
              type: object
      summary: Enable or disable user
      tags:
      - Admin
  /attributes:
    get:
      parameters:
      - description: Search in key, title or name
        in: query
        name: search
        type: string
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 20
        description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.PaginatedResponse'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/internal_product.Attribute'
                        type: array
                    type: object
              type: object
      summary: List attributes
      tags:
      - Attributes
    post:
      consumes:
      - application/json
      description: Creates a standalone attribute that can later be assigned to any
        product. key must be unique.
      parameters:
      - description: Attribute
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_product.CreateAttributeDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_product.Attribute'
              type: object
      summary: Create attribute
      tags:
      - Attributes
  /attributes/{id}:
    delete:
      description: Soft-deletes the attribute and unassigns it from all products
      parameters:
      - description: Attribute ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.MessageResponse'
              type: object
      summary: Delete attribute
      tags:
      - Attributes
    get:
      parameters:
      - description: Attribute ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_product.Attribute'
              type: object
      summary: Get attribute
      tags:
      - Attributes
    patch:
      consumes:
      - application/json
      parameters:
      - description: Attribute ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_product.UpdateAttributeDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_proarash_ecommerce-server_internal_types.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_product.Attribute'
              type: object
      summary: Update attribute
      tags:
      - Attributes
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Login with mobile/password for every user; the user's roles are read from the database and returned in the body. Every login creates a new session, so each device stays logged in independently; the session stores the device type, user agent and last IP.
        X-Device-Type 1 (browser, default): a 24h access token is set as the httpOnly x-access-token cookie (SameSite=Lax, Secure in production); the browser sends it automatically. When it expires the server renews it from the stored session (90 days) and sets the new cookie on that same request, so the client never handles the token.
        X-Device-Type 2 (native app): refresh_token (a 90 day JWT) is returned in the body and no cookie is set. Send it as the X-Access-Token request header (or Authorization: Bearer) on every request.
      parameters:
      - description: 1 = browser (default), 2 = native app
        enum:
        - 1
        - 2
        in: header
        name: X-Device-Type
        type: integer
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: x-access-token (httpOnly, browser only)
              type: string
          schema:
